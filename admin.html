<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trailscape back office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
  :root { --fg: #0d1321; --muted: #6b7079; --band: #f4f4f4; --line: #e3e4e7; --ok: #00c44f; --okbg: #ccffe0; --warn: #8a5300; --warnbg: #fff0d4; --info: #1f5fb3; --infobg: #e3efff; --bad: #b42318; --badbg: #fde4e1; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 Inter, system-ui, sans-serif; letter-spacing: -0.01em; color: var(--fg); background: #fff; }
  .mono { font-family: "Fragment Mono", ui-monospace, monospace; font-size: .85em; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
  header b { font-weight: 600; } header nav { display: flex; gap: 6px; flex-wrap: wrap; }
  button, .btn { font: inherit; border: 0; border-radius: 999px; padding: 7px 14px; background: var(--band); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--fg); color: #fff; } button[aria-pressed="true"] { background: var(--fg); color: #fff; } button:disabled { opacity: .45; cursor: default; }
  input, select, textarea { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: #fff; color: var(--fg); width: 100%; }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr); min-height: calc(100vh - 60px); }
  #list { padding: 16px 20px; border-right: 1px solid var(--line); overflow: auto; }
  #side { padding: 16px 20px; display: grid; gap: 14px; align-content: start; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  .kpi { background: var(--band); border-radius: 8px; padding: 10px 12px; } .kpi small { color: var(--muted); display: block; font-size: .78rem; } .kpi b { font-size: 1.3rem; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: .78rem; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 9px 8px; border-bottom: 1px solid var(--band); vertical-align: top; } tr[data-ref] { cursor: pointer; } tr.on td { background: var(--band); }
  td small { display: block; color: var(--muted); font-size: .78rem; } .r { text-align: right; white-space: nowrap; }
  .tag { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: .76rem; white-space: nowrap; background: var(--band); }
  .tag.ok { background: var(--okbg); color: #006b2c; } .tag.warn { background: var(--warnbg); color: var(--warn); } .tag.info { background: var(--infobg); color: var(--info); } .tag.bad { background: var(--badbg); color: var(--bad); }
  .card { background: var(--band); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
  .row2 { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; } .row2 span:first-child { color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .log { display: grid; gap: 6px; font-size: .85rem; } .log div { display: grid; grid-template-columns: 92px 1fr; gap: 8px; } .log time { color: var(--muted); }
  h2 { font-size: 1.35rem; font-weight: 500; margin: 0; } h3 { font-size: 1rem; font-weight: 600; margin: 0; }
  .muted { color: var(--muted); } .err { color: var(--bad); font-size: .88rem; }
  .msgs { display: grid; gap: 8px; } .msg { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .86rem; }
  .msg.in { border-left: 3px solid var(--info); } .msg header { all: unset; display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .78rem; }
  .msg pre { white-space: pre-wrap; font: inherit; margin: 6px 0 0; max-height: 220px; overflow: auto; } .btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
  #login { max-width: 360px; margin: 12vh auto; display: grid; gap: 12px; padding: 0 20px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--fg); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: .9rem; z-index: 9; }
  .sw { position: relative; display: inline-block; width: 38px; height: 22px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw span { position: absolute; inset: 0; border-radius: 999px; background: #d5d7db; transition: background .15s; cursor: pointer; }
  .sw span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .sw input:checked + span { background: var(--ok); } .sw input:checked + span::after { transform: translateX(16px); }
  .sw input:focus-visible + span { outline: 2px solid var(--info); outline-offset: 2px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; } .filters input { max-width: 260px; }
  .consentrow { display: flex; align-items: center; gap: 10px; } .consentrow b { font-weight: 600; }
  .room { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
  .room h4 { margin: 0; font-size: .95rem; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .rates { width: 100%; font-size: .84rem; } .rates td { padding: 4px 6px; border-bottom: 1px solid var(--band); } .rates td.r { text-align: right; }
  .link { background: none; padding: 0; color: var(--info); border-radius: 0; font-size: .82rem; } .link.bad { color: var(--bad); }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .missing { color: var(--warn); }
  /* Grey buttons vanish on grey cards: give them a white face there. */
  .card button:not(.primary):not(.link):not([aria-pressed="true"]), .card .btn:not(.primary) { background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  header nav button:not([aria-pressed="true"]):hover, header nav .btn:hover { background: #e7e8ea; }
  td.nw { white-space: nowrap; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } #list { border-right: 0; border-bottom: 1px solid var(--line); } .kpis { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const API = "/api/admin";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const R = n => n == null ? "–" : "R" + Math.round(n).toLocaleString("en-ZA").replace(/[, ]/g, " ");
const day = s => new Date(s + "T00:00:00Z").toLocaleDateString("en-ZA", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short", year: "numeric" });
const when = s => new Date(s).toLocaleString("en-ZA", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const toast = t => { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); };
let show = "open", sel = location.hash.slice(1) || null;

const LABEL = {
  new: ["New", "warn"], asked_operator: ["Asked operator", "info"], operator_replied: ["Operator replied", "warn"], offer_sent: ["Offer sent", "info"],
  accepted: ["Accepted", "ok"], declined: ["Declined", ""], unavailable: ["Unavailable", ""], cancelled: ["Cancelled", ""],
  received: ["To book", "warn"], booking_operator: ["Booking with operator", "info"], confirmed: ["Confirmed", "ok"], failed: ["Failed", "bad"],
};
const tag = s => { const [t, c] = LABEL[s] || [s, ""]; return `<span class="tag ${c}">${esc(t)}</span>`; };

// Uses the admin account's sign-in (made on the site's My trips page); the session cookie goes with every request.
async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, credentials: "same-origin", headers: opts.body ? { "Content-Type": "application/json" } : {} });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { signedOut(); throw new Error(data.error || "Signed out"); }
  if (!r.ok) throw new Error(data.error || "Request failed (" + r.status + ")");
  return data;
}
async function logout() { try { await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }); } catch {} location.href = "/"; }
function signedOut() {
  $("#app").innerHTML = `<div id="login"><h2>Trailscape back office</h2>
    <p class="muted">This page is for the Trailscape admin account. Sign in on the site under My trips, then come back here.</p>
    <a class="btn primary" href="/#trips" style="text-align:center;text-decoration:none">Sign in</a></div>`;
}

// Every section button in the header carries data-nav; exactly one is pressed (black) at a time.
function setNav(key) { document.querySelectorAll("header [data-nav]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.nav === key))); }

function shell() {
  $("#app").innerHTML = `<header><b>Trailscape back office</b><nav>
      <button data-nav="open">Needs action</button><button data-nav="all">Everything</button><button data-nav="outreach">Outreach</button>
      <button data-nav="venues">Venues &amp; rooms</button><button data-nav="stays">Stays &amp; prices</button><button data-nav="blocks">Block nights</button>
      <button data-nav="unmatched">Unmatched replies</button><a class="btn" href="/" style="text-decoration:none">Site</a><button id="out">Sign out</button></nav></header>
    <main><section id="list"></section><aside id="side"><p class="muted">Pick an enquiry or booking.</p></aside></main>`;
  const toQueue = k => { show = k; inVenues = inOutreach = false; curVenue = curOut = null; if (/^#(venue|outreach)/.test(location.hash)) history.replaceState(null, "", location.pathname); setNav(k); queue(); };
  const go = { open: () => toQueue("open"), all: () => toQueue("all"), outreach: () => { curOut = null; outreach(); }, venues: () => { curVenue = null; venues(); },
    stays: () => { setNav("stays"); staysForm(); }, blocks: () => { setNav("blocks"); blockForm(); }, unmatched: () => { setNav("unmatched"); unmatched(); } };
  document.querySelectorAll("header [data-nav]").forEach(b => b.onclick = () => go[b.dataset.nav]());
  $("#out").onclick = logout;
  if (location.hash.startsWith("#venue-")) { venues(); venue(decodeURIComponent(location.hash.slice(7))); }
  else if (location.hash === "#venues") venues();
  else if (location.hash.startsWith("#outreach-")) { outreach(); outVenue(decodeURIComponent(location.hash.slice(10))); }
  else if (location.hash === "#outreach") outreach();
  else { setNav(show); queue(); if (sel) detail(sel); }
}

async function queue() {
  const el = $("#list");
  try {
    const { counts: c, items } = await api("/queue?show=" + show);
    el.innerHTML = `<div class="kpis">
        <div class="kpi"><small>Open enquiries</small><b>${c.open_enquiries}</b></div><div class="kpi"><small>Bookings to place</small><b>${c.open_bookings}</b></div>
        <div class="kpi"><small>Confirmed value</small><b>${R(c.confirmed_value)}</b></div><div class="kpi"><small>Confirmed fees</small><b>${R(c.confirmed_fees)}</b></div></div>
      ${items.length ? `<table><thead><tr><th>Ref</th><th>Stay</th><th>Guest</th><th>Dates</th><th class="r">Hikers</th><th>Status</th><th class="r">Total</th></tr></thead><tbody>
      ${items.map(i => `<tr data-ref="${esc(i.ref)}" class="${i.ref === sel ? "on" : ""}"><td class="mono">${esc(i.ref)}<small>${i.type}</small></td>
        <td>${esc(i.stay_name)}<small>${esc(i.operator)}</small></td><td>${esc(i.guest_name)}<small>${when(i.created_at)}</small></td>
        <td>${esc(i.check_in)}<small>${i.nights} night${i.nights === 1 ? "" : "s"}</small></td><td class="r">${i.hikers}</td><td>${tag(i.status)}</td>
        <td class="r">${i.type === "enquiry" && i.total ? "≈ " : ""}${R(i.total)}</td></tr>`).join("")}</tbody></table>`
      : `<p class="muted">${show === "open" ? "Nothing needs action right now." : "No enquiries or bookings yet."}</p>`}`;
    el.querySelectorAll("tr[data-ref]").forEach(tr => tr.onclick = () => detail(tr.dataset.ref));
  } catch (err) { el.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
}

async function detail(ref) {
  sel = ref; history.replaceState(null, "", "#" + ref);
  if (!inVenues && !inOutreach) setNav(show);
  document.querySelectorAll("tr[data-ref]").forEach(tr => tr.classList.toggle("on", tr.dataset.ref === ref));
  const side = $("#side"); side.innerHTML = `<p class="muted">Loading ${esc(ref)}…</p>`;
  let d; try { d = await api("/requests/" + encodeURIComponent(ref)); } catch (err) { side.innerHTML = `<p class="err">${esc(err.message)}</p>`; return; }
  const enq = d.type === "enquiry";
  const statuses = enq ? ["new", "asked_operator", "operator_replied", "offer_sent", "accepted", "declined", "unavailable", "cancelled"] : ["received", "booking_operator", "confirmed", "cancelled", "failed"];
  side.innerHTML = `
    <div><span class="mono muted">${esc(d.ref)} · ${enq ? "Enquiry" : "Booking"}${d.source && d.source !== "instant" ? " from enquiry" : ""}</span><h2>${esc(d.stay_name)}</h2>
      <div class="muted">${esc(d.operator)} · ${day(d.check_in)} → ${day(d.check_out)} · ${d.nights} night${d.nights === 1 ? "" : "s"} · ${d.hikers} hiker${d.hikers === 1 ? "" : "s"}${enq && d.flexible ? " · dates flexible" : ""}</div></div>
    <div>${tag(d.status)} ${!enq ? `<span class="tag ${d.payment_status === "paid" ? "ok" : d.payment_status === "stub" ? "warn" : ""}">Payment: ${esc(d.payment_status)}</span>` : ""}</div>
    <div class="card"><h3>Guest</h3><div>${esc(d.guest_name)}</div><div><a href="mailto:${esc(d.guest_email)}?subject=${encodeURIComponent("Trailscape " + d.ref + ": " + d.stay_name)}">${esc(d.guest_email)}</a> · <a href="tel:${esc(d.guest_phone)}">${esc(d.guest_phone)}</a></div>
      ${d.notes ? `<div class="muted">“${esc(d.notes)}”</div>` : ""}</div>
    <div class="card"><h3>Operator</h3><div>${esc(d.operator)}${d.engine ? ` · ${esc(d.engine)}${d.stay_engine_ref ? " #" + esc(d.stay_engine_ref) : ""}` : ""}</div>
      <div>${d.booking_email ? `<a href="mailto:${esc(d.booking_email)}">${esc(d.booking_email)}</a>` : `<span class="muted">No email on file</span>`}${d.booking_phone ? " · " + esc(d.booking_phone) : ""}</div>
      <div class="muted" style="font-size:.85rem">Rate on file ${R(d.price_pp)} pp/night${d.price_estimated ? " (estimate)" : ""}</div></div>
    ${enq ? stayEmailCard(d) : ""}
    <div class="card">${enq ? `
      <div class="row2"><span>Guide total shown</span><span>${R(d.guide_total)}</span></div>
      ${d.quoted_stay != null ? `<div class="row2"><span>Quoted</span><span>${R(d.quoted_stay)} + fee ${R(d.quoted_fee)} = ${R(d.quoted_stay + d.quoted_fee)}</span></div>` : ""}
      ${d.booking_ref ? `<div class="row2"><span>Booking</span><span><a href="#${esc(d.booking_ref)}" id="golink" class="mono">${esc(d.booking_ref)}</a></span></div>` : ""}` : `
      <div class="row2"><span>Stay fees</span><span>${R(d.stay_fees)}</span></div><div class="row2"><span>Trailscape fee</span><span>${R(d.service_fee)}</span></div>
      <div class="row2"><span><b>Total</b></span><span><b>${R(d.total)}</b></span></div>
      ${d.client_total != null && d.client_total !== d.total ? `<div class="err">Site showed ${R(d.client_total)}</div>` : ""}
      ${d.engine_ref ? `<div class="row2"><span>Operator ref</span><span class="mono">${esc(d.engine_ref)}</span></div>` : ""}`}</div>
    <form class="card" id="upd"><h3>Update</h3>
      <div class="grid2"><label>Status<select id="u-status">${statuses.map(s => `<option value="${s}" ${s === d.status ? "selected" : ""}>${esc((LABEL[s] || [s])[0])}</option>`).join("")}</select></label>
      ${enq ? `<label>Operator price (stay fees)<input id="u-quote" type="number" min="0" step="1" value="${d.quoted_stay ?? ""}" placeholder="e.g. 9440"></label>`
            : `<label>Operator reference<input id="u-eref" value="${esc(d.engine_ref || "")}"></label>`}</div>
      ${enq ? "" : `<label>Payment<select id="u-pay">${["none", "stub", "held", "paid", "refunded", "failed"].map(s => `<option ${s === d.payment_status ? "selected" : ""}>${s}</option>`).join("")}</select></label>`}
      <label>Note for the log<textarea id="u-note" rows="2"></textarea></label>
      ${enq ? `<span class="muted" style="font-size:.8rem">Setting “Accepted” creates the booking at the operator price and holds the beds.</span>` : `<span class="muted" style="font-size:.8rem">Cancelled or failed frees the beds.</span>`}
      <button class="primary">Save</button><p class="err" id="u-err"></p></form>
    <div><h3 style="margin-bottom:6px">Log</h3><div class="log">${d.log.map(l => `<div><time>${when(l.at)}</time><span>${esc(l.text)} <span class="muted">· ${esc(l.actor)}</span></span></div>`).join("")}</div></div>`;
  if ($("#golink")) $("#golink").onclick = e => { e.preventDefault(); detail(d.booking_ref); };
  if (enq) bindStayEmail(d);
  $("#upd").onsubmit = async e => {
    e.preventDefault();
    const body = {};
    const st = $("#u-status").value; if (st !== d.status) body.status = st;
    if (enq) { const q = $("#u-quote").value; if (q !== "" && +q !== d.quoted_stay) body.quotedStay = +q; }
    else { const r = $("#u-eref").value.trim(); if (r !== (d.engine_ref || "")) body.engineRef = r; const p = $("#u-pay").value; if (p !== d.payment_status) body.paymentStatus = p; }
    const n = $("#u-note").value.trim(); if (n) body.note = n;
    if (!Object.keys(body).length) { $("#u-err").textContent = "Nothing changed."; return; }
    try { const res = await api("/requests/" + encodeURIComponent(d.ref), { method: "POST", body: JSON.stringify(body) }); toast(res.createdBooking ? "Booking " + res.createdBooking + " created" : "Saved"); queue(); detail(d.ref); }
    catch (err) { $("#u-err").textContent = err.message; }
  };
}

// Easy enquire: the availability email to the stay, its answer and the email thread.
function stayEmailCard(d) {
  const open = ["new", "asked_operator", "operator_replied", "offer_sent", "unavailable"].includes(d.status);
  const answer = d.op_answer ? `<div class="row2"><span>Stay's answer</span><span>${d.op_answer === "available" ? `<span class="tag ok">Has space</span>` : `<span class="tag bad">Full</span>`}${d.op_price != null ? " " + R(d.op_price) : ""}</span></div>
      ${d.op_note ? `<div class="muted" style="font-size:.85rem">“${esc(d.op_note)}”</div>` : ""}` : "";
  return `<div class="card"><h3>Stay email</h3>
    <div class="row2"><span>Asked</span><span>${d.op_asked_at ? when(d.op_asked_at) : `<span class="tag warn">Not emailed yet</span>`}</span></div>
    ${answer}
    ${d.answerLink ? `<div class="muted" style="font-size:.8rem">Answer page: <a href="${esc(d.answerLink)}" target="_blank" rel="noopener">open</a>${d.replyAddress ? ` · replies to <span class="mono">${esc(d.replyAddress)}</span>` : ""}</div>` : ""}
    ${open ? `<div class="btnrow"><button id="op-ask" ${d.booking_email ? "" : "disabled title=\"Add a booking email under Stays first\""}>${d.op_asked_at ? "Send reminder" : "Email the stay"}</button></div>
    <form id="op-ans" style="display:grid;gap:8px"><span class="muted" style="font-size:.85rem">Got an answer by email or phone? Record it here. A price or a “full” answer emails the guest.</span>
      <div class="grid2"><label>Total for the group (R)<input id="op-price" type="number" min="0" step="1" value="${d.op_price ?? ""}" placeholder="e.g. 4800"></label>
      <label>Note<input id="op-note" value="${esc(d.op_note || "")}" placeholder="optional"></label></div>
      <div class="btnrow"><button class="primary" data-a="available">Has space</button><button data-a="unavailable">Full</button></div><p class="err" id="op-err"></p></form>` : ""}
    ${d.messages && d.messages.length ? `<div class="msgs">${d.messages.map(m => `<div class="msg ${m.direction}"><header><span>${m.direction === "in" ? (m.channel === "form" ? "Answer page" : "From " + esc(m.from_addr)) : "To " + esc(m.to_addr)}</span><time>${when(m.at)}</time></header>
      ${m.subject && m.channel === "email" ? `<div><b>${esc(m.subject)}</b></div>` : ""}<pre>${esc(m.body)}</pre></div>`).join("")}</div>` : ""}</div>`;
}
function bindStayEmail(d) {
  const ask = $("#op-ask"); if (ask) ask.onclick = async () => {
    ask.disabled = true;
    try { await api("/requests/" + encodeURIComponent(d.ref) + "/ask", { method: "POST" }); toast("Emailed the stay"); queue(); detail(d.ref); }
    catch (err) { ask.disabled = false; $("#op-err").textContent = err.message; }
  };
  const f = $("#op-ans"); if (!f) return;
  f.querySelectorAll("button[data-a]").forEach(b => b.onclick = async e => {
    e.preventDefault();
    const a = b.dataset.a, price = $("#op-price").value, note = $("#op-note").value.trim();
    if (!confirm(a === "unavailable" ? "Mark as full and email the guest?" : price ? `Record ${R(+price)} and email the guest an offer?` : "Record “has space” without a price? The guest is emailed once you add the price.")) return;
    try { const r = await api("/requests/" + encodeURIComponent(d.ref) + "/answer", { method: "POST", body: JSON.stringify({ answer: a, price: price || null, note }) });
      toast(r.emailedGuest ? "Saved, guest emailed" : "Saved"); queue(); detail(d.ref); }
    catch (err) { $("#op-err").textContent = err.message; }
  });
}
async function unmatched() {
  sel = null; history.replaceState(null, "", location.pathname);
  const side = $("#side"); side.innerHTML = `<p class="muted">Loading…</p>`;
  try {
    const rows = await api("/inbound");
    side.innerHTML = `<div class="card"><h3>Unmatched replies</h3><p class="muted" style="margin:0;font-size:.85rem">Emails to the reply address that didn't match an enquiry. Each was also forwarded to you.</p></div>

// ---------- Venues & rooms: every stay with its contact email, consent (= shown on the site), rooms and rates ----------
let inVenues = false, vf = { q: "", consent: "", email: false, rooms: false }, curVenue = null;
const BASIS = { unit: "per unit", person: "per person" };
const shortDay = s => s ? new Date(s + "T00:00:00Z").toLocaleDateString("en-ZA", { timeZone: "UTC", day: "numeric", month: "short", year: "2-digit" }) : "";
const sw = (id, on, label) => `<label class="sw" title="${on ? "Shown on the site" : "Hidden from the site"}" onclick="event.stopPropagation()"><input type="checkbox" data-consent="${esc(id)}" ${on ? "checked" : ""} aria-label="${esc(label)}"><span></span></label>`;

async function setConsent(id, on, input) {
  try {
    await api("/stays/" + encodeURIComponent(id), { method: "PATCH", body: JSON.stringify({ consent: on }) });
    toast(on ? "Consent recorded · shown on the map" : "Hidden from the map · record kept");
    if (inVenues) drawVenues(); if (curVenue === id) venue(id);
    if (inOutreach) drawOutreach(); if (curOut === id) outVenue(id);
  } catch (err) { if (input) input.checked = !on; toast(err.message); }
}
function bindConsent(root) {
  root.querySelectorAll("input[data-consent]").forEach(i => i.onchange = () => setConsent(i.dataset.consent, i.checked, i));
}

function venues() {
  inVenues = true; inOutreach = false; curOut = null; sel = null;
  if (!location.hash.startsWith("#venue-")) history.replaceState(null, "", "#venues");
  setNav("venues");
  $("#list").innerHTML = `<div class="kpis" id="v-kpis"></div>
    <div class="filters"><input id="v-q" placeholder="Search name, ID, operator or type" value="${esc(vf.q)}">
      <select id="v-c" style="width:auto"><option value="">All venues</option><option value="yes" ${vf.consent === "yes" ? "selected" : ""}>Shown (consent yes)</option><option value="no" ${vf.consent === "no" ? "selected" : ""}>Hidden (consent no)</option></select>
      <button id="v-em" aria-pressed="${vf.email}">No email</button><button id="v-rm" aria-pressed="${vf.rooms}">No rooms yet</button></div>
    <div class="filters"><a class="btn" href="${API}/rooms-csv" style="text-decoration:none">Download rooms &amp; rates (CSV)</a>
      <a class="btn" href="${API}/rooms-csv?all=1" style="text-decoration:none" title="Includes every venue, also hidden ones without rooms, so you can fill them in">Download blank sheet for all venues</a>
      <label class="btn" style="display:inline-block;color:var(--fg);font-size:inherit">Upload CSV<input type="file" id="v-up" accept=".csv,text/csv" hidden></label></div>
    <div id="v-tab"><p class="muted">Loading…</p></div>`;
  let t; $("#v-q").oninput = () => { clearTimeout(t); t = setTimeout(() => { vf.q = $("#v-q").value.trim(); drawVenues(); }, 250); };
  $("#v-c").onchange = () => { vf.consent = $("#v-c").value; drawVenues(); };
  $("#v-em").onclick = () => { vf.email = !vf.email; $("#v-em").setAttribute("aria-pressed", vf.email); drawVenues(); };
  $("#v-rm").onclick = () => { vf.rooms = !vf.rooms; $("#v-rm").setAttribute("aria-pressed", vf.rooms); drawVenues(); };
  $("#v-up").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) importCsv(f); };
  if (!curVenue) $("#side").innerHTML = `<div class="card"><h3>Venues &amp; rooms</h3><p class="muted" style="margin:0;font-size:.88rem">The switch is the provider's consent. On: the venue shows on the map and takes enquiries. Off: the record stays here but is hidden from the site. Pick a venue to edit its contact email, rooms and rates.</p></div>`;
  drawVenues();
}
async function drawVenues() {
  const el = $("#v-tab"); if (!el) return;
  const qs = new URLSearchParams({ q: vf.q, ...(vf.consent ? { consent: vf.consent } : {}), ...(vf.email ? { email: "missing" } : {}), ...(vf.rooms ? { rooms: "missing" } : {}) });
  try {
    const { counts: c, items } = await api("/venues?" + qs);
    $("#v-kpis").innerHTML = `<div class="kpi"><small>Venues</small><b>${c.total}</b></div><div class="kpi"><small>Shown on map</small><b>${c.consented || 0}</b></div>
      <div class="kpi"><small>No email on file</small><b>${c.no_email || 0}</b></div><div class="kpi"><small>No rooms yet</small><b>${c.no_rooms || 0}</b></div>`;
    el.innerHTML = items.length ? `<table><thead><tr><th>Venue</th><th>Booking email</th><th class="r">Rooms</th><th class="r">From</th><th>Consent</th></tr></thead><tbody>
      ${items.map(v => `<tr data-v="${esc(v.id)}" class="${v.id === curVenue ? "on" : ""}" style="cursor:pointer">
        <td>${esc(v.name)}<small class="mono">${esc(v.id)} · ${esc(v.operator)}</small></td>
        <td>${v.booking_email ? esc(v.booking_email) : `<span class="missing">Add email</span>`}${v.contact_name ? `<small>${esc(v.contact_name)}</small>` : ""}</td>
        <td class="r">${v.rooms || `<span class="muted">–</span>`}${v.rooms ? `<small>${v.rates} rate${v.rates === 1 ? "" : "s"}</small>` : ""}</td>
        <td class="r">${v.from_rate ? R(v.from_rate) : `<span class="muted">–</span>`}</td>
        <td><div class="consentrow">${sw(v.id, v.consent, "Consent for " + v.name)}<span class="tag ${v.consent ? "ok" : ""}">${v.consent ? "Shown" : "Hidden"}</span></div></td></tr>`).join("")}</tbody></table>
      ${items.length >= 400 ? `<p class="muted">Showing the first 400. Search to narrow the list.</p>` : ""}`
      : `<p class="muted">No venues match.</p>`;
    el.querySelectorAll("tr[data-v]").forEach(tr => tr.onclick = () => venue(tr.dataset.v));
    bindConsent(el);
  } catch (err) { el.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
}

async function venue(id) {
  curVenue = id; history.replaceState(null, "", "#venue-" + encodeURIComponent(id));
  document.querySelectorAll("tr[data-v]").forEach(tr => tr.classList.toggle("on", tr.dataset.v === id));
  const side = $("#side"); side.innerHTML = `<p class="muted">Loading…</p>`;
  let v; try { v = await api("/venues/" + encodeURIComponent(id)); } catch (err) { side.innerHTML = `<p class="err">${esc(err.message)}</p>`; return; }
  const rooms = v.roomList.filter(m => m.active), archived = v.roomList.filter(m => !m.active);
  side.innerHTML = `
    <div><span class="mono muted">${esc(v.id)} · ${esc(v.operator)} · ${v.mode === "instant" ? "Instant booking" : "Easy enquire"}</span><h2>${esc(v.name)}</h2><div class="muted">${esc(v.kind || "")}</div></div>
    <div class="card"><div class="consentrow">${sw(v.id, v.consent, "Consent for " + v.name)}<b>${v.consent ? "Consent received · shown on the map" : "No consent yet · hidden from the site"}</b></div>
      <span class="muted" style="font-size:.82rem">${v.consent && v.consent_at ? "Switched on " + when(v.consent_at) + ". " : ""}Off keeps everything here but removes the venue from the map and stay pages, and stops new enquiries.</span></div>
    <form class="card" id="vc"><h3>Contact</h3>
      <div class="grid2"><label>Booking email${v.booking_email ? "" : ` <span class="missing">· none on file</span>`}<input id="vc-email" type="email" value="${esc(v.booking_email || "")}" placeholder="bookings@example.co.za"></label>
        <label>Contact person<input id="vc-name" value="${esc(v.contact_name || "")}" placeholder="optional"></label></div>
      <div class="grid2"><label>Phone<input id="vc-phone" value="${esc(v.booking_phone || "")}"></label>
        <label>Rate sheet link (PDF or page)<input id="vc-rates" type="url" value="${esc(v.rates_url || "")}" placeholder="https://…"></label></div>
      <label>Consent note<input id="vc-note" value="${esc(v.consent_note || "")}" placeholder="e.g. Owner replied yes by email, 12 Nov"></label>
      <div class="btnrow"><button class="primary">Save contact</button>${v.rates_url ? `<a class="btn" href="${esc(v.rates_url)}" target="_blank" rel="noopener" style="text-decoration:none">Open rate sheet ↗</a>` : ""}</div><p class="err" id="vc-err"></p></form>
    <div class="card"><div class="row2"><h3>Rooms &amp; rates</h3><span class="muted" style="font-size:.82rem">${v.rates_checked_at ? "Last updated " + when(v.rates_checked_at) : "Nothing entered yet"}</span></div>
      ${rooms.length ? rooms.map(roomHTML).join("") : `<p class="muted" style="margin:0;font-size:.88rem">No room types yet. Add each room, unit, hut or campsite type with its nightly rates.</p>`}
      <div id="room-new"></div>
      <div class="btnrow"><button id="r-add" class="primary">Add room type</button>${rooms.length ? `<button id="r-ok" title="Use when the provider confirms nothing has changed">Mark rates confirmed</button>` : ""}</div>
      ${archived.length ? `<details><summary class="muted" style="font-size:.85rem;cursor:pointer">${archived.length} hidden room type${archived.length === 1 ? "" : "s"}</summary>${archived.map(roomHTML).join("")}</details>` : ""}</div>
    <div class="btnrow"><button id="v-back">Back to the list</button></div>`;
  bindConsent(side);
  $("#v-back").onclick = () => { curVenue = null; history.replaceState(null, "", "#venues"); venues(); };
  $("#vc").onsubmit = async e => {
    e.preventDefault();
    const body = { bookingEmail: $("#vc-email").value.trim(), contactName: $("#vc-name").value.trim(), bookingPhone: $("#vc-phone").value.trim(), ratesUrl: $("#vc-rates").value.trim(), consentNote: $("#vc-note").value.trim() };
    try { await api("/stays/" + encodeURIComponent(v.id), { method: "PATCH", body: JSON.stringify(body) }); toast("Contact saved"); drawVenues(); venue(v.id); }
    catch (err) { $("#vc-err").textContent = err.message; }
  };
  $("#r-add").onclick = () => { $("#room-new").innerHTML = roomForm(null); bindRoomForm(v, null); $("#r-add").hidden = true; };
  if ($("#r-ok")) $("#r-ok").onclick = async () => { try { await api("/stays/" + encodeURIComponent(v.id), { method: "PATCH", body: JSON.stringify({ ratesChecked: true }) }); toast("Rates marked as confirmed today"); venue(v.id); } catch (err) { toast(err.message); } };
  side.querySelectorAll("[data-act]").forEach(b => b.onclick = e => { e.preventDefault(); roomAction(v, b.dataset.act, +b.dataset.room, +b.dataset.rate || null); });
}

function roomHTML(m) {
  const meta = [m.sleeps ? "Sleeps " + m.sleeps : "", m.bed_setup, m.units > 1 ? m.units + " units" : ""].filter(Boolean).map(esc).join(" · ");
  return `<div class="room" id="room-${m.id}"><h4><span>${esc(m.name)}${m.active ? "" : ` <span class="tag">hidden</span>`}</span>
      <span class="btnrow"><button class="link" data-act="edit" data-room="${m.id}">Edit</button><button class="link" data-act="addrate" data-room="${m.id}">Add rate</button><button class="link bad" data-act="del" data-room="${m.id}">Delete</button></span></h4>
    ${meta ? `<div class="muted" style="font-size:.84rem">${meta}</div>` : ""}${m.included ? `<div style="font-size:.84rem">Includes: ${esc(m.included)}</div>` : ""}
    ${m.rates.length ? `<table class="rates"><tbody>${m.rates.map(r => `<tr><td>${esc(r.label)}${r.valid_from || r.valid_to ? `<small class="muted" style="display:block">${shortDay(r.valid_from) || "…"} – ${shortDay(r.valid_to) || "…"}</small>` : ""}</td>
      <td class="r"><b>${R(r.amount)}</b><small class="muted" style="display:block">${BASIS[r.basis]} / night</small></td>
      <td style="font-size:.78rem" class="muted">${[r.min_nights ? "min " + r.min_nights + " nights" : "", r.extra_person ? "+" + R(r.extra_person) + " extra person" : "", esc(r.notes || "")].filter(Boolean).join("<br>")}</td>
      <td class="r"><button class="link" data-act="editrate" data-room="${m.id}" data-rate="${r.id}">Edit</button> <button class="link bad" data-act="delrate" data-room="${m.id}" data-rate="${r.id}">×</button></td></tr>`).join("")}</tbody></table>`
      : `<div class="missing" style="font-size:.84rem">No rate yet</div>`}
    <div data-slot="${m.id}"></div></div>`;
}
function roomForm(m) {
  m = m || {};
  return `<form class="room" data-roomform><h4>${m.id ? "Edit room type" : "New room type"}</h4>
    <label>Name<input name="name" required value="${esc(m.name || "")}" placeholder="e.g. Hut 1, Double en-suite, Campsite (6 people)"></label>
    <div class="grid3"><label>Sleeps<input name="sleeps" type="number" min="1" value="${m.sleeps ?? ""}"></label><label>How many units<input name="units" type="number" min="1" value="${m.units ?? 1}"></label>
      <label>Shown<select name="active"><option value="1">Yes</option><option value="0" ${m.active === 0 ? "selected" : ""}>Hidden</option></select></label></div>
    <label>Bed setup<input name="bedSetup" value="${esc(m.bed_setup || "")}" placeholder="e.g. 1 double + 2 single bunks"></label>
    <label>Included<input name="included" value="${esc(m.included || "")}" placeholder="e.g. Linen, towels, firewood · self-catering"></label>
    <label>Internal notes<input name="notes" value="${esc(m.notes || "")}"></label>
    ${m.id ? "" : `<span class="muted" style="font-size:.8rem">Starting rate (more rates can be added after saving)</span>${rateFields({})}`}
    <div class="btnrow"><button class="primary">Save</button><button type="button" data-cancel>Cancel</button></div><p class="err"></p></form>`;
}
const rateFields = r => `<div class="grid3"><label>Label<input name="label" value="${esc(r.label || "Standard")}" placeholder="Standard, Peak, Weekend"></label>
    <label>Rate (R per night)<input name="amount" type="number" min="1" value="${r.amount ?? ""}"></label>
    <label>Charged<select name="basis"><option value="unit">per unit</option><option value="person" ${r.basis === "person" ? "selected" : ""}>per person</option></select></label></div>
  <div class="grid2"><label>Valid from<input name="validFrom" type="date" value="${r.valid_from || ""}"></label><label>Valid to (last night)<input name="validTo" type="date" value="${r.valid_to || ""}"></label></div>
  <div class="grid3"><label>Min nights<input name="minNights" type="number" min="1" value="${r.min_nights ?? ""}"></label><label>Extra person (R)<input name="extraPerson" type="number" min="0" value="${r.extra_person ?? ""}"></label>
    <label>Rate notes<input name="rnotes" value="${esc(r.notes || "")}"></label></div>`;
const formVals = f => Object.fromEntries([...new FormData(f)].map(([k, v]) => [k, String(v).trim()]));
const rateBody = o => ({ label: o.label, amount: o.amount, basis: o.basis, validFrom: o.validFrom || null, validTo: o.validTo || null, minNights: o.minNights || null, extraPerson: o.extraPerson || null, notes: o.rnotes || null });

function bindRoomForm(v, m) {
  const f = (m ? $(`#room-${m.id}`) : $("#room-new")).querySelector("[data-roomform]");
  f.querySelector("[data-cancel]").onclick = () => venue(v.id);
  f.onsubmit = async e => {
    e.preventDefault();
    const o = formVals(f), room = { name: o.name, sleeps: o.sleeps || null, units: o.units || 1, bedSetup: o.bedSetup, included: o.included, notes: o.notes, active: o.active === "1" };
    try {
      if (m) await api("/rooms/" + m.id, { method: "PATCH", body: JSON.stringify(room) });
      else await api("/venues/" + encodeURIComponent(v.id) + "/rooms", { method: "POST", body: JSON.stringify({ ...room, rates: o.amount ? [rateBody(o)] : [] }) });
      toast("Room saved"); drawVenues(); venue(v.id);
    } catch (err) { f.querySelector(".err").textContent = err.message; }
  };
}
async function roomAction(v, act, roomId, rateId) {
  const m = v.roomList.find(x => x.id === roomId), box = document.querySelector(`#room-${roomId} [data-slot]`);
  if (act === "edit") { $(`#room-${roomId}`).innerHTML = roomForm(m); bindRoomForm(v, m); return; }
  if (act === "del") {
    if (!confirm(`Delete "${m.name}" and its ${m.rates.length} rate(s)? To keep it on record but off the site, edit it and set Shown to Hidden instead.`)) return;
    try { await api("/rooms/" + roomId, { method: "DELETE" }); toast("Room deleted"); drawVenues(); venue(v.id); } catch (err) { toast(err.message); } return;
  }
  if (act === "delrate") {
    if (!confirm("Delete this rate?")) return;
    try { await api("/rates/" + rateId, { method: "DELETE" }); toast("Rate deleted"); drawVenues(); venue(v.id); } catch (err) { toast(err.message); } return;
  }
  const r = act === "editrate" ? m.rates.find(x => x.id === rateId) : {};
  box.innerHTML = `<form style="display:grid;gap:8px;border-top:1px solid var(--line);padding-top:8px"><b style="font-size:.88rem">${rateId ? "Edit rate" : "New rate for " + esc(m.name)}</b>${rateFields(r)}
    <div class="btnrow"><button class="primary">Save rate</button><button type="button" data-cancel>Cancel</button></div><p class="err"></p></form>`;
  const f = box.querySelector("form");
  f.querySelector("[data-cancel]").onclick = () => { box.innerHTML = ""; };
  f.onsubmit = async e => {
    e.preventDefault();
    try {
      const body = JSON.stringify(rateBody(formVals(f)));
      if (rateId) await api("/rates/" + rateId, { method: "PATCH", body }); else await api("/rooms/" + roomId + "/rates", { method: "POST", body });
      toast("Rate saved"); drawVenues(); venue(v.id);
    } catch (err) { f.querySelector(".err").textContent = err.message; }
  };
}

async function importCsv(file) {
  const csv = await file.text(), side = $("#side");
  curVenue = null;
  side.innerHTML = `<p class="muted">Checking ${esc(file.name)}…</p>`;
  const summary = r => `<div class="row2"><span>Venues touched</span><span>${r.stays}</span></div><div class="row2"><span>New room types</span><span>${r.roomsNew}</span></div>
    <div class="row2"><span>Room types updated</span><span>${r.roomsUpdated}</span></div><div class="row2"><span>New rates</span><span>${r.ratesNew}</span></div><div class="row2"><span>Rates updated</span><span>${r.ratesUpdated}</span></div>`;
  try {
    const r = await api("/rooms-import", { method: "POST", body: JSON.stringify({ csv }) });
    if (r.errors.length) { side.innerHTML = `<div class="card"><h3>Fix these lines first</h3><p class="muted" style="margin:0;font-size:.85rem">Nothing was saved.</p>${r.errors.map(x => `<div class="err">${esc(x)}</div>`).join("")}</div>`; return; }
    side.innerHTML = `<div class="card"><h3>Ready to import ${esc(file.name)}</h3>${summary(r)}
      <span class="muted" style="font-size:.82rem">Rows with a room_id or rate_id update that room or rate; rows without one are added. Nothing is deleted by an import.</span>
      <div class="btnrow"><button class="primary" id="imp-go">Import</button><button id="imp-no">Cancel</button></div><p class="err" id="imp-err"></p></div>`;
    $("#imp-no").onclick = venues;
    $("#imp-go").onclick = async () => {
      $("#imp-go").disabled = true;
      try { const done = await api("/rooms-import", { method: "POST", body: JSON.stringify({ csv, apply: true }) }); side.innerHTML = `<div class="card"><h3>Imported</h3>${summary(done)}</div>`; toast("Rooms and rates imported"); drawVenues(); }
      catch (err) { $("#imp-go").disabled = false; $("#imp-err").textContent = err.message; }
    };
  } catch (err) { side.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
}

// ---------- Outreach: who we've asked for consent, who answered, who to chase ----------
let inOutreach = false, of = { q: "", status: "", due: false, email: false }, curOut = null;
const OUT = { planned: ["Planned", ""], sent: ["Sent", "info"], replied: ["Replied", "warn"], yes: ["Said yes", "ok"], declined: ["Declined", "bad"], no_reply: ["No reply", "warn"], bounced: ["Bounced", "bad"] };
const otag = s => s ? `<span class="tag ${OUT[s][1]}">${OUT[s][0]}</span>` : `<span class="tag">Not contacted</span>`;
const today = () => new Date().toISOString().slice(0, 10);
const plusDays = (d, n) => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const FROM_ADDR = "hello@trailscape.co.za", FOLLOW_DAYS = 7;

function outreach() {
  inOutreach = true; inVenues = false; curVenue = null; sel = null; setNav("outreach");
  if (!location.hash.startsWith("#outreach-")) history.replaceState(null, "", "#outreach");
  $("#list").innerHTML = `<div class="kpis" id="o-kpis"></div>
    <div class="filters"><input id="o-q" placeholder="Search name, ID, operator or email" value="${esc(of.q)}">
      <select id="o-s" style="width:auto"><option value="">All private &amp; community venues</option><option value="none">Not contacted</option><option value="open">Awaiting reply</option>
        ${Object.entries(OUT).map(([k, [t]]) => `<option value="${k}">${t}</option>`).join("")}</select>
      <button id="o-due" aria-pressed="${of.due}">Follow-up due</button><button id="o-em" aria-pressed="${of.email}">Has email</button></div>
    <div id="o-tab"><p class="muted">Loading…</p></div>`;
  $("#o-s").value = of.status;
  let t; $("#o-q").oninput = () => { clearTimeout(t); t = setTimeout(() => { of.q = $("#o-q").value.trim(); drawOutreach(); }, 250); };
  $("#o-s").onchange = () => { of.status = $("#o-s").value; drawOutreach(); };
  $("#o-due").onclick = () => { of.due = !of.due; $("#o-due").setAttribute("aria-pressed", of.due); drawOutreach(); };
  $("#o-em").onclick = () => { of.email = !of.email; $("#o-em").setAttribute("aria-pressed", of.email); drawOutreach(); };
  if (!curOut) $("#side").innerHTML = `<div class="card"><h3>Outreach</h3><p class="muted" style="margin:0;font-size:.88rem">Every private, community and municipal venue, with the consent email we sent, whether they've answered and when to chase them. A follow-up date is set ${FOLLOW_DAYS} days after each email. A “yes” is recorded here; switching consent on is what puts the venue on the map. Pick a venue to update it.</p></div>`;
  drawOutreach();
}
async function drawOutreach() {
  const el = $("#o-tab"); if (!el) return;
  const qs = new URLSearchParams({ q: of.q, ...(of.status ? { status: of.status } : {}), ...(of.due ? { due: "1" } : {}), ...(of.email ? { email: "has" } : {}) });
  try {
    const { counts: c, items } = await api("/outreach?" + qs);
    $("#o-kpis").innerHTML = `<div class="kpi"><small>Contacted</small><b>${c.contacted}</b></div><div class="kpi"><small>Awaiting reply</small><b>${c.awaiting}</b></div>
      <div class="kpi"><small>Said yes</small><b>${c.yes}</b></div><div class="kpi"><small>Follow-ups due</small><b>${c.due}</b></div>`;
    const now = today();
    el.innerHTML = items.length ? `<table><thead><tr><th>Venue</th><th>Booking email</th><th>Status</th><th>Sent</th><th>Follow up</th><th>Map</th></tr></thead><tbody>
      ${items.map(v => { const due = v.follow_up_on && v.follow_up_on <= now && ["sent", "no_reply", "replied"].includes(v.status);
        return `<tr data-o="${esc(v.id)}" class="${v.id === curOut ? "on" : ""}" style="cursor:pointer">
        <td>${esc(v.name)}<small class="mono">${esc(v.id)} · ${esc(v.operator)}</small></td>
        <td>${v.booking_email ? esc(v.booking_email) : `<span class="missing">No email</span>`}${v.contact_name ? `<small>${esc(v.contact_name)}</small>` : ""}</td>
        <td>${otag(v.status)}${v.follow_ups ? `<small>${v.follow_ups} follow-up${v.follow_ups === 1 ? "" : "s"}</small>` : ""}</td>
        <td class="nw">${v.sent_at ? shortDay(v.sent_at) : `<span class="muted">–</span>`}${v.replied_at ? `<small>replied ${shortDay(v.replied_at)}</small>` : ""}</td>
        <td class="nw">${v.follow_up_on && ["sent", "no_reply", "replied", "planned"].includes(v.status) ? `<span class="${due ? "err" : ""}">${shortDay(v.follow_up_on)}</span>${due ? "<small>due</small>" : ""}` : `<span class="muted">–</span>`}</td>
        <td><span class="tag ${v.consent ? "ok" : ""}">${v.consent ? "Shown" : "Hidden"}</span></td></tr>`; }).join("")}</tbody></table>
      ${items.length >= 400 ? `<p class="muted">Showing the first 400. Search to narrow the list.</p>` : ""}`
      : `<p class="muted">No venues match.</p>`;
    el.querySelectorAll("tr[data-o]").forEach(tr => tr.onclick = () => outVenue(tr.dataset.o));
  } catch (err) { el.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
}
async function oSave(id, body, msg) {
  try { await api("/outreach/" + encodeURIComponent(id), { method: "POST", body: JSON.stringify(body) }); toast(msg || "Saved"); drawOutreach(); outVenue(id); }
  catch (err) { const e = $("#o-err"); if (e) e.textContent = err.message; else toast(err.message); }
}
async function outVenue(id) {
  curOut = id; curVenue = null; history.replaceState(null, "", "#outreach-" + encodeURIComponent(id));
  document.querySelectorAll("tr[data-o]").forEach(tr => tr.classList.toggle("on", tr.dataset.o === id));
  const side = $("#side"); side.innerHTML = `<p class="muted">Loading…</p>`;
  let v; try { v = await api("/outreach/" + encodeURIComponent(id)); } catch (err) { side.innerHTML = `<p class="err">${esc(err.message)}</p>`; return; }
  const o = v.outreach || {}, st = o.status || null, now = today();
  const quick = [];
  if (!st || st === "planned") quick.push(["sent", "Mark sent today", true]);
  if (st === "sent" || st === "no_reply") quick.push(["follow", "Follow-up sent today"], ["replied", "They replied"], ["no_reply", "No reply"]);
  if (st === "sent" || st === "no_reply" || st === "replied") quick.push(["yes", "Said yes", st === "replied"], ["declined", "Declined"]);
  if (st === "sent") quick.push(["bounced", "Bounced"]);
  if (st === "yes" && !v.consent) quick.push(["consent", "Switch consent on (show on map)", true]);
  side.innerHTML = `
    <div><span class="mono muted">${esc(v.id)} · ${esc(v.operator)}</span><h2>${esc(v.name)}</h2><div>${otag(st)}</div></div>
    <div class="card"><h3>Contact</h3>
      <div>${v.booking_email ? `<a href="mailto:${esc(v.booking_email)}">${esc(v.booking_email)}</a>` : `<span class="missing">No booking email on file.</span> <button class="link" id="o-ven">Add one under Venues &amp; rooms</button>`}${v.booking_phone ? " · " + esc(v.booking_phone) : ""}</div>
      ${v.contact_name ? `<div class="muted">${esc(v.contact_name)}</div>` : ""}
      <div class="consentrow">${sw(v.id, v.consent, "Consent for " + v.name)}<b>${v.consent ? "Consent on · shown on the map" : "Consent off · hidden from the site"}</b></div></div>
    ${quick.length ? `<div class="card"><h3>Quick update</h3><div class="btnrow">${quick.map(([k, t, p]) => `<button data-q="${k}" class="${p ? "primary" : ""}">${t}</button>`).join("")}</div>
      <span class="muted" style="font-size:.8rem">Sending an email or follow-up sets the next follow-up ${FOLLOW_DAYS} days out. A reply clears it.</span></div>` : ""}
    <form class="card" id="of"><h3>Details</h3>
      <div class="grid2"><label>Status<select id="of-status">${Object.entries(OUT).map(([k, [t]]) => `<option value="${k}" ${k === (st || "sent") ? "selected" : ""}>${t}</option>`).join("")}</select></label>
        <label>Email used<select id="of-tpl">${["short", "full", "other"].map(x => `<option value="${x}" ${x === (o.template || "short") ? "selected" : ""}>${x === "short" ? "Short version" : x === "full" ? "Full version" : "Other"}</option>`).join("")}</select></label></div>
      <div class="grid2"><label>Sent to<input id="of-to" type="email" value="${esc(o.sent_to || v.booking_email || "")}"></label><label>Sent from<input id="of-from" type="email" value="${esc(o.sent_from || FROM_ADDR)}"></label></div>
      <div class="grid3"><label>Sent on<input id="of-sent" type="date" value="${o.sent_at || ""}"></label><label>Replied on<input id="of-rep" type="date" value="${o.replied_at || ""}"></label>
        <label>Follow up on<input id="of-fu" type="date" value="${o.follow_up_on || ""}"></label></div>
      <label>Note<textarea id="of-note" rows="2" placeholder="e.g. Asked for rates for the cottages; sent PDF">${esc(o.note || "")}</textarea></label>
      <label>Add to history<input id="of-log" placeholder="optional, e.g. Phoned, owner away until Friday"></label>
      <div class="btnrow"><button class="primary">Save</button>${v.outreach ? `<button type="button" class="link bad" id="of-clear">Clear record</button>` : ""}</div><p class="err" id="o-err"></p></form>
    <div><h3 style="margin-bottom:6px">History</h3>${v.log.length ? `<div class="log">${v.log.map(l => `<div><time>${when(l.at)}</time><span>${esc(l.text)}</span></div>`).join("")}</div>` : `<p class="muted" style="margin:0">Nothing yet.</p>`}</div>
    <div class="btnrow"><button id="o-back">Back to the list</button></div>`;
  bindConsent(side);
  if ($("#o-ven")) $("#o-ven").onclick = () => { venues(); venue(v.id); };
  $("#o-back").onclick = () => { curOut = null; history.replaceState(null, "", "#outreach"); outreach(); };
  side.querySelectorAll("button[data-q]").forEach(b => b.onclick = () => {
    const k = b.dataset.q;
    if (k === "sent") return oSave(v.id, { status: "sent", template: o.template || "short", sentTo: o.sent_to || v.booking_email || null, sentFrom: o.sent_from || FROM_ADDR,
      sentAt: now, followUpOn: plusDays(now, FOLLOW_DAYS), logNote: `Sent ${o.template || "short"} outreach email${v.booking_email ? " to " + v.booking_email : ""}` }, "Marked as sent");
    if (k === "follow") return oSave(v.id, { status: "sent", followUpSent: true, followUpOn: plusDays(now, FOLLOW_DAYS) }, "Follow-up recorded");
    if (k === "replied") return oSave(v.id, { status: "replied", repliedAt: o.replied_at || now, followUpOn: null }, "Reply recorded");
    if (k === "no_reply") return oSave(v.id, { status: "no_reply" }, "Marked as no reply");
    if (k === "yes") return oSave(v.id, { status: "yes", repliedAt: o.replied_at || now, followUpOn: null }, "Recorded: said yes");
    if (k === "declined") return oSave(v.id, { status: "declined", repliedAt: o.replied_at || now, followUpOn: null }, "Recorded: declined");
    if (k === "bounced") return oSave(v.id, { status: "bounced", followUpOn: null, logNote: "Email bounced: check the address" }, "Marked as bounced");
    if (k === "consent") return oSave(v.id, { consent: true, consentNote: `Owner said yes to outreach email${o.replied_at ? ", " + shortDay(o.replied_at) : ""}` }, "Consent on · shown on the map");
  });
  if ($("#of-clear")) $("#of-clear").onclick = async () => {
    if (!confirm("Clear this outreach record? The venue goes back to “not contacted”; its history is kept.")) return;
    try { await api("/outreach/" + encodeURIComponent(v.id), { method: "DELETE" }); toast("Record cleared"); drawOutreach(); outVenue(v.id); } catch (err) { $("#o-err").textContent = err.message; }
  };
  $("#of").onsubmit = e => {
    e.preventDefault();
    oSave(v.id, { status: $("#of-status").value, template: $("#of-tpl").value, sentTo: $("#of-to").value.trim(), sentFrom: $("#of-from").value.trim(),
      sentAt: $("#of-sent").value || null, repliedAt: $("#of-rep").value || null, followUpOn: $("#of-fu").value || null, note: $("#of-note").value.trim(), logNote: $("#of-log").value.trim() || undefined });
  };
}

let isAdmin = false;
window.addEventListener("hashchange", () => { const r = location.hash.slice(1); if (isAdmin && r && r !== sel && !/^(venue|outreach)/.test(r)) detail(r); });
fetch("/api/auth/me", { credentials: "same-origin" }).then(r => r.json()).then(d => { isAdmin = !!(d.user && d.user.admin); isAdmin ? shell() : signedOut(); }).catch(signedOut);
</script>
</body>
</html>
