<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trailscape · Plan and book hikes in South Africa</title>
<meta name="description" content="Take a hike. Plan and book hikes and overnight stays in South Africa.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fragment+Mono&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: marketing pages are centred 1120px columns on alternating white / stone bands;
   the map page is a full-height split (list rail left, map right); back office is a dense table + side panel. */
:root {
  /* Nøsen Hundreds palette: ink on white, light grey chips, fresh green for "available" */
  --bg: #ffffff;
  --band: #f4f4f4;
  --soft: #fafafa;
  --card: #ffffff;
  --fg: #0d1321;           /* ink */
  --muted: #5b606b;        /* ink-soft */
  --line: #ececec;
  --green: #0d1321;        /* primary buttons are ink */
  --green-hover: #262c3a;
  --green-fg: #ffffff;
  --accent: #00c44f;       /* availability dots, active underline */
  --accent-soft: #ccffe0;
  --clay: #00a043;         /* route line, focus ring */
  --clay-soft: #ccffe0;
  --ok: #0b7a35; --warn: #8a5a00; --info: #1f5fb3; --bad: #b3362b;
  --ok-bg: #ccffe0; --warn-bg: #fff1d6; --info-bg: #e3efff; --bad-bg: #ffe1df;
  --land: #efeee6; --sea: #dde6e6; --border-geo: #a9ab9c;
  --serif: "Inter", ui-sans-serif, system-ui, sans-serif;
  --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  --mono: "Fragment Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 8px;
  --shadow: none;
  --shadow-lg: 0 8px 24px rgba(13,19,33,.10);
  --nav-h: 62px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body:not(.overhero) main { padding-top: calc(var(--nav-h) + env(safe-area-inset-top, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 1000; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: .85em; }
.num { font-variant-numeric: tabular-nums; }

/* nav: transparent over the hero, solid white once you scroll (or on inner pages) */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 900; padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: 20px; background: transparent; border-bottom: 1px solid transparent; transition: background .25s, padding .25s, border-color .25s; }
.nav::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.nav.solid::before { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.nav.solid { background: rgba(255,255,255,.9); border-bottom-color: var(--line); padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 12px; }
.nav .wrap { display: flex; align-items: center; gap: 28px; height: 38px; }
.logo { display: flex; align-items: center; gap: 9px; text-decoration: none; font-weight: 600; font-size: .875rem; white-space: nowrap; color: #fff; }
.nav.solid .logo { color: var(--fg); }
.logo svg { width: 26px; height: 26px; flex: none; }
.links { display: flex; gap: 32px; flex: 1; min-width: 0; justify-content: center; }
.links a { text-decoration: none; color: rgba(255,255,255,.8); font-size: .875rem; font-weight: 500; line-height: 20px; padding: 4px 0; position: relative; white-space: nowrap; transition: color .15s; }
.links a:hover { color: #fff; }
.nav.solid .links a { color: var(--muted); }
.nav.solid .links a:hover, .nav.solid .links a.on { color: var(--fg); }
.links a.on { color: #fff; }
.links a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 2px; border-radius: 2px; background: var(--clay); }
.navr { display: flex; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 6px; padding: 10px 20px; font-size: .875rem; line-height: 20px; font-weight: 600; border: 1px solid transparent; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn.primary { background: var(--green); color: var(--green-fg); box-shadow: var(--shadow); }
.btn.primary:hover { background: var(--green-hover); }
.btn.line { background: var(--card); border-color: var(--line); }
.btn.line:hover { border-color: var(--muted); }
.btn.sm { padding: 8px 20px; font-size: .875rem; }
.nav .btn.line { background: #fff; border-color: transparent; font-weight: 500; padding: 8px 16px; }
.nav.solid .btn.line { border-color: var(--line); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.menu-btn { display: none; }

/* hero */
.hero { position: relative; overflow: hidden; color: #fff; background: #2a302b; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero .wrap { position: relative; padding-block: 160px 128px; text-shadow: 0 2px 18px rgba(0,0,0,.35); }
.hero h1 { font-size: 4.5rem; line-height: 1.05; max-width: 48rem; color: #fff; margin-top: 24px; }
.hero p { font-size: 1.125rem; max-width: 40rem; color: rgba(255,255,255,.88); margin: 24px 0 36px; }
.hero .cta { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.hero .btn { font-size: 1rem; line-height: 24px; padding: 16px 32px; text-shadow: none; }
.hero .btn.light { background: var(--green); color: var(--green-fg); border: 2px solid rgba(255,255,255,.7); box-shadow: var(--shadow-lg); }
.hero .btn.light:hover { background: var(--green-hover); }
.hero .btn.ghost { border: 2px solid rgba(255,255,255,.7); color: #fff; background: rgba(0,0,0,.18); }
.hero .btn.ghost:hover { background: rgba(0,0,0,.32); }
.hero small { color: rgba(255,255,255,.75); }

section.band { padding-block: 128px; }
section.band.alt { background: var(--band); }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
.h2 { font-size: 2.75rem; line-height: 1.25; }
.lead { font-size: 1rem; color: var(--muted); margin: 20px 0 0; max-width: 28rem; }
.split { display: grid; grid-template-columns: 1fr 1.15fr; gap: 56px; align-items: start; }
.split > * { min-width: 0; }
.steps { display: grid; gap: 14px; }
.step { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; display: grid; grid-template-columns: 48px 1fr; gap: 6px 4px; box-shadow: var(--shadow); }
.step .n { font-family: var(--serif); font-weight: 600; color: var(--clay); font-size: 1.875rem; line-height: 1.2; grid-row: span 2; }
.step b { font-family: var(--serif); font-weight: 600; font-size: 1.25rem; line-height: 1.4; }
.step span { color: var(--muted); }

.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 36px; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 36px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; text-decoration: none; transition: border-color .15s, transform .15s; }
.tile { box-shadow: var(--shadow); }
.tile:hover { border-color: #c9c9c9; transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.tile canvas { width: 100%; aspect-ratio: 16 / 9; display: block; max-width: 100%; }
.tile .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 4px; }
.tile h3 { font-size: 1.25rem; line-height: 1.4; }
.tile .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); margin-top: 6px; }
.tile .go { color: var(--green); font-weight: 600; margin-top: 8px; font-size: .92rem; }

.feature { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 40px; box-shadow: var(--shadow); }
.feature > * { min-width: 0; }
.feature ul { margin: 16px 0 24px; padding: 0; list-style: none; display: grid; gap: 8px; }
.feature li { padding-left: 22px; position: relative; }
.feature li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 10px; height: 2px; background: var(--clay); }
.feature canvas { width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; display: block; max-width: 100%; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--line); margin-top: 40px; }
.stat { padding: 24px 20px 0 0; }
.stat b { font-family: var(--serif); font-weight: 600; font-size: 3rem; display: block; line-height: 1; }
.stat span { color: var(--muted); font-size: .95rem; }

.howpay { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: 36px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); overflow: hidden; }
.howpay div { padding: 20px; border-right: 1px solid var(--line); }
.howpay div:last-child { border-right: 0; }
.howpay .k { font-family: var(--mono); font-size: .75rem; color: var(--clay); }
.howpay b { display: block; font-family: var(--serif); font-weight: 600; font-size: 1.08rem; margin: 6px 0 4px; }
.howpay span { color: var(--muted); font-size: .93rem; }

.signup { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.signup input { flex: 1 1 240px; min-width: 0; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); }

footer { border-top: 1px solid var(--line); padding-block: 48px 40px; font-size: .92rem; }
footer .cols { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 28px; }
footer h4 { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 10px; }
footer a { display: block; text-decoration: none; color: var(--muted); padding: 3px 0; }
footer a:hover { color: var(--fg); }
footer .fine { margin-top: 36px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.sample-flag { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 800; background: #fff; color: var(--fg); font-size: .78rem; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow-lg); max-width: calc(100% - 24px); }
.sample-flag b { color: var(--clay); font-weight: 600; }
.sample-flag button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 1rem; line-height: 1; padding: 0 0 0 6px; }

/* map page: list rail + map split */
.planner { display: grid; grid-template-columns: 400px 1fr; height: calc(100dvh - var(--nav-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
.planner > * { min-height: 0; min-width: 0; }
.rail { border-right: 1px solid var(--line); overflow-y: auto; background: var(--band); padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.routecard { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.routecard select { padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); width: 100%; font-weight: 600; }
.ends { display: grid; gap: 4px; font-size: .95rem; }
.ends span { display: flex; gap: 8px; align-items: center; }
.ends i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.pills { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .92rem; }
.pills b { font-variant-numeric: tabular-nums; }
.controls2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); }
.field input, .field select, .field textarea { padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: .95rem; width: 100%; min-width: 0; }
.timeline { position: relative; display: flex; flex-direction: column; gap: 12px; padding-left: 34px; }
.timeline::before { content: ""; position: absolute; left: 12px; top: 14px; bottom: 14px; border-left: 2px dashed var(--clay); opacity: .55; }
.tl-end { display: flex; flex-direction: column; position: relative; }
.tl-end::before { content: ""; position: absolute; left: -31px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--green); }
.tl-end small { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.tl-end b { font-family: var(--serif); font-weight: 600; }
.night { position: relative; padding: 14px 16px; cursor: pointer; }
.night::before { content: attr(data-n); position: absolute; left: -34px; top: 14px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); border: 1.5px solid var(--clay); color: var(--clay); font-size: .78rem; font-weight: 700; display: grid; place-items: center; }
.night.on { border-color: var(--clay); }
.night h3 { font-size: 1.12rem; font-weight: 600; }
.night .sub { font-size: .85rem; color: var(--muted); }
.legs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.legs small { display: block; font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.legs b { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.legs b em { font-style: normal; font-weight: 400; font-size: .8rem; color: var(--muted); margin-left: 2px; }
.avail { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-top: 10px; }
.avail.ok { background: var(--ok-bg); color: var(--ok); }
.avail.warn { background: var(--warn-bg); color: var(--warn); }
.avail.info { background: var(--info-bg); color: var(--info); }
.mapwrap { position: relative; }
#pmap, #hmap { position: absolute; inset: 0; background: var(--sea); }
.pin { width: 14px; height: 14px; border-radius: 50%; background: var(--c, var(--green)); border: 2.5px solid var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.pin.stage { width: 22px; height: 22px; background: var(--card); border: 2px solid var(--clay); color: var(--clay); font: 700 11px/18px var(--sans); text-align: center; }
.pin.end { width: 18px; height: 18px; background: var(--green); border-radius: 4px; }
.maplegend { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; z-index: 500; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: .8rem; color: var(--muted); max-width: 270px; box-shadow: var(--shadow); }


/* MapLibre map chrome */
.maplibregl-map { font-family: var(--sans); }
.mstyle { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); margin: 10px 0 0 10px; }
.mstyle button { border: 0; background: none; padding: 7px 11px; font-size: .82rem; font-weight: 600; cursor: pointer; color: var(--muted); border-right: 1px solid var(--line); }
.mstyle button:last-child { border-right: 0; }
.mstyle button.on, .mstyle button.on:hover { background: var(--green) !important; color: var(--green-fg) !important; }
.mchip[aria-pressed="true"] { background: var(--card); color: var(--fg); border-color: var(--line); }
.mchip[aria-pressed="false"] { opacity: .45; }
.maplibregl-popup-content { font-family: var(--sans); font-weight: 600; font-size: .85rem; padding: 6px 10px; border-radius: 6px; box-shadow: var(--shadow); }
.mlist { display: flex; flex-direction: column; gap: 10px; }
.mitem { padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; width: 100%; font: inherit; color: inherit; }
.mitem:hover, .mitem.on { border-color: var(--clay); }
.mitem h3 { font-size: 1.05rem; font-weight: 600; }
.mitem .meta { font-size: .82rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; grid-column: 1 / -1; }
.mitem .pr { font-size: .85rem; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mitem .acts { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 8px; }
.mcount { font-size: .85rem; color: var(--muted); display: flex; justify-content: space-between; }

/* page header for inner pages */
.phead { padding-block: 64px 32px; border-bottom: 1px solid var(--line); }
.phead h1 { font-size: 2.75rem; line-height: 1.2; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 13px; cursor: pointer; font-size: .9rem; display: inline-flex; gap: 7px; align-items: center; }
.chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.list { padding-block: 24px 64px; display: grid; gap: 0; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 18px 4px; border-bottom: 1px solid var(--line); text-decoration: none; align-items: center; }
.row:hover h3 { color: var(--green); }
.row h3 { font-size: 1.2rem; }
.row .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); margin-top: 3px; }
.row .right { text-align: right; font-size: .9rem; }
.row .right b { display: block; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.op { display: inline-flex; align-items: center; gap: 6px; }
.op i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tag { display: inline-flex; align-items: center; font-size: .78rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.info { background: var(--info-bg); color: var(--info); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.mute { background: var(--band); color: var(--muted); border: 1px solid var(--line); }

/* stay detail */
.detail { display: grid; grid-template-columns: 1fr 380px; gap: 40px; padding-block: 32px 72px; align-items: start; }
.detail > * { min-width: 0; }
.crumbs { font-size: .9rem; color: var(--muted); margin-bottom: 14px; }
.crumbs a { color: var(--muted); }
.factrow { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: var(--radius); margin: 22px 0; background: var(--card); }
.factrow div { padding: 14px 16px; border-right: 1px solid var(--line); }
.factrow div:last-child { border-right: 0; }
.factrow small { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.factrow b { font-variant-numeric: tabular-nums; font-size: 1.15rem; font-family: var(--serif); font-weight: 600; }
.prose { max-width: 62ch; }
.prose h2 { font-size: 1.45rem; margin: 30px 0 10px; }
.hutchips { display: flex; flex-wrap: wrap; gap: 8px; }
.hutchips span { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--card); font-size: .92rem; }
.minimap { position: relative; height: 300px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); margin-top: 26px; }
.bookbox { position: sticky; top: calc(var(--nav-h) + 20px + env(safe-area-inset-top, 0px)); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.bookbox .price { font-family: var(--serif); font-size: 1.6rem; }
.bookbox .price small { font-family: var(--sans); font-size: .9rem; color: var(--muted); }
.how { font-size: .88rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
.how b { color: var(--fg); }

/* booking flow */
.flow { max-width: 760px; margin: 0 auto; padding-block: 36px 72px; }
.stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 24px 0 28px; }
.stepper div { border-top: 3px solid var(--line); padding-top: 8px; font-size: .85rem; color: var(--muted); font-weight: 600; }
.stepper div.on { border-color: var(--clay); color: var(--fg); }
.stepper div.done { border-color: var(--green); color: var(--fg); }
.panel { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.quote { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.quote td { padding: 10px 0; border-bottom: 1px solid var(--line); }
.quote td:last-child { text-align: right; white-space: nowrap; }
.quote tr.total td { border-bottom: 0; font-weight: 700; font-size: 1.15rem; padding-top: 14px; }
.quote .sub { color: var(--muted); font-size: .85rem; }

/* ===== Trailscape theme: Nøsen Hundreds style =====
   Inter at 16px with tight negative tracking, ink #0d1321 on white, #f4f4f4 chips,
   fresh-green "available" accents, 8px frosted-white panels. Overrides the rules above. */
body { line-height: 1.35; letter-spacing: -0.02em; }
h1, h2, h3, h4 { font-family: var(--sans); font-weight: 400; letter-spacing: -0.04em; }
h1 { line-height: 1.1; }
h2, h3 { line-height: 1.25; }
.h2, .phead h1 { font-size: 2rem; font-weight: 400; line-height: 1.1; }
.lead { font-size: 1rem; color: var(--muted); max-width: 36rem; }
.eyebrow { font-size: .875rem; text-transform: none; letter-spacing: -0.02em; font-weight: 400; color: var(--muted); }
.wrap { max-width: 1200px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
section.band { padding-block: 96px; }
section.band.alt { background: var(--band); }

/* buttons */
.btn { border-radius: 8px; font-size: 1rem; font-weight: 500; letter-spacing: -0.02em; padding: 10px 16px; box-shadow: none; }
.btn.primary { background: var(--green); color: #fff; box-shadow: none; }
.btn.line { background: var(--band); border-color: transparent; }
.btn.line:hover { background: #ebebeb; border-color: transparent; }
.btn.sm { padding: 8px 12px; font-size: .875rem; }

/* nav: wordmark top-left, links top-right, frosted chips while over the hero */
.nav { padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: 16px; }
.nav.solid { padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; background: rgba(255,255,255,.9); }
.nav .wrap { max-width: none; height: 40px; gap: 16px; }
.logo { font-size: 1rem; font-weight: 400; letter-spacing: -0.02em; color: var(--fg); padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,.9); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.logo sup { font-size: .6em; }
.nav.solid .logo { background: transparent; padding-left: 0; }
.links { flex: 0 1 auto; margin-left: auto; justify-content: flex-end; gap: 24px; padding: 8px 16px; border-radius: 8px; background: rgba(255,255,255,.9); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.nav.solid .links { background: transparent; padding-right: 0; }
.links a, .nav.solid .links a { color: var(--fg); font-size: 1rem; font-weight: 400; line-height: 1.2; padding: 0; opacity: .72; }
.links a:hover, .links a.on, .nav.solid .links a:hover, .nav.solid .links a.on { color: var(--fg); opacity: 1; }
.links a.on::after { bottom: -6px; height: 2px; background: var(--accent); }
.menu-btn { background: rgba(255,255,255,.9) !important; border: 0 !important; font-weight: 400; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.nav.solid .menu-btn { background: var(--band) !important; }

/* hero: our video, faded into white at the bottom, with a Nøsen-style frosted card */
.hero { min-height: min(100svh, 920px); display: flex; align-items: center; color: var(--fg); background: #fff; }
.hero canvas { opacity: .95; }
.hero .herowrap { position: relative; z-index: 1; width: 100%; padding-block: 120px 160px; text-shadow: none; display: flex; justify-content: center; }
.herocard { width: min(100%, 360px); padding: 16px; border-radius: 8px; background: rgba(255,255,255,.9); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; flex-direction: column; gap: 8px; }
.hero h1, .herocard h1 { font-size: 2rem; line-height: 1.1; letter-spacing: -0.04em; font-weight: 400; color: var(--fg); margin: 8px 0 0; max-width: none; }
.hero p.herosub { font-size: 1rem; line-height: 1.2; color: var(--fg); margin: 4px 0 16px; max-width: none; }
.herorows { display: flex; flex-direction: column; gap: 8px; }
.herorow { display: flex; flex-direction: column; gap: 14px; padding: 12px 8px 8px; border-radius: 8px; background: #fff; text-decoration: none; color: var(--fg); transition: background .15s; }
.herorow:hover { background: var(--soft); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .875rem; line-height: 1; letter-spacing: -0.04em; padding: 6px 8px; border-radius: 6px; background: var(--band); color: var(--fg); }

.pill.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.pill + .pill { margin-left: auto; }

/* cards, tiles, lists */
.step, .tile, .feature, .card, .howpay, .factrow { border-color: transparent; box-shadow: none; }
.step, .tile, .feature, .howpay { background: var(--band); }

.tile:hover { border-color: transparent; box-shadow: none; transform: translateY(-2px); }

.step b { font-size: 1.375rem; font-weight: 500; }
.tile h3 { font-size: 1.375rem; font-weight: 500; }
.tile .go { color: var(--fg); font-weight: 500; }
.feature li::before { background: var(--accent); }

.row:hover h3 { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.chip { border-radius: 6px; border-color: transparent; background: var(--band); font-size: .875rem; }
.chip[aria-pressed="true"] { background: var(--fg); color: #fff; border-color: var(--fg); }
.tag { border-radius: 6px; font-weight: 400; font-size: .875rem; padding: 4px 8px; letter-spacing: -0.04em; color: var(--fg) !important; gap: 6px; }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.tag.ok { background: var(--accent-soft); } .tag.ok::before { background: var(--accent); }
.tag.warn { background: #fff1d6; } .tag.warn::before { background: #e09a00; }
.tag.info { background: #e3efff; } .tag.info::before { background: #2f7de1; }
.tag.bad { background: #ffe1df; } .tag.bad::before { background: #e5483d; }
.tag.mute::before { background: var(--muted); }
.field input, .field select, .field textarea, .signup input, .routecard select { border-radius: 8px; border-color: transparent; background: var(--band); }
.rail { background: #fafafa; }
footer { border-top: 0; background: var(--band); }
footer h4 { text-transform: none; letter-spacing: -0.02em; font-size: .875rem; font-weight: 400; }
.sample-flag b { color: var(--fg); }
.toast { border-radius: 8px; font-weight: 400; }

@media (max-width: 960px) {
  .links { margin-left: 0; padding: 0; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }

}

<script>
// Header sits transparently over the hero on the home page and turns solid white once you scroll.
(function () {
  var nav = document.querySelector(".nav");
  function update() {
    var h = location.hash.replace("#", "");
    var home = h === "" || h === "home";
    document.body.classList.toggle("overhero", home);
    nav.classList.toggle("solid", !home || window.scrollY > 40);
  }
  addEventListener("scroll", update, { passive: true });
  addEventListener("hashchange", update);
  update();
})();
